<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #09090b;
      /* Replace 'your-image.jpg' with your photo path or URL */
      background-image: url('your-image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Dark overlay to enhance text readability over any background image */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1;
    }

    .countdown {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 1.8vw;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: 10vw; /* Reduced font size for better balance with background */
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      drop-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .separator {
      font-size: 8vw;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.3);
      line-height: 0.9;
      margin-top: -1vw;
    }
  </style>
</head>
<body>

  <div class="countdown">
    <div class="unit"><span class="number" id="days">00</span></div>
    <div class="separator">:</div>
    <div class="unit"><span class="number" id="hours">00</span></div>
    <div class="separator">:</div>
    <div class="unit"><span class="number" id="minutes">00</span></div>
    <div class="separator">:</div>
    <div class="unit"><span class="number" id="seconds">00</span></div>
  </div>

  <script>
    function getNextAugust31() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetDate = new Date(`August 31, ${targetYear} 00:00:00`);

      if (now > targetDate) {
        targetYear++;
        targetDate = new Date(`August 31, ${targetYear} 00:00:00`);
      }
      return targetDate.getTime();
    }

    const targetTime = getNextAugust31();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetTime - now;

      if (difference <= 0) {
        document.querySelector('.countdown').innerHTML = '<span class="number">00:00:00:00</span>';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
